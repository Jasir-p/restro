services:
 db:
   image: postgres:17
   environment:
     POSTGRES_DB: ${DB_NAME}
     POSTGRES_USER: ${DB_USER}
     POSTGRES_PASSWORD: ${DB_PASSWORD}
   ports:
     - "5432:5432"
   volumes:
     - postgres_data:/var/lib/postgresql/data
   restart: unless-stopped
   env_file:
     - .env
 
 django-web:
   build: .
   container_name: django-docker
   ports:
     - "8000:8000"
   depends_on:
     - db
   restart: unless-stopped
   env_file:
     - .env
   volumes:
   - .:/app
 redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
      

 celery:
    build: .
    command: celery -A confiq worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app

 celery-beat:
    build: .
    command: celery -A confiq beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app


volumes:
  postgres_data:
  redis_data: